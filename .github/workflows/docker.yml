name: Docker
on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
permissions: {}
env:
  MAIN_DISTRO: debian
jobs:
  # arm64 は QEMU を避けてネイティブ runner でビルドし、arch ごとに SHA サフィックス付きで
  # push、build ジョブで multi-arch manifest にまとめる。
  build-arch:
    name: Build images per arch
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        distro:
          - alpine
          - debian
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.sha }}-${{ matrix.distro }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.arch }}
          provenance: false
          push: true
  build:
    name: Build images
    needs: build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        distro:
          - alpine
          - debian
    steps:
      - name: Docker tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.distro }}
            type=ref,event=branch,enable=${{ matrix.distro == env.MAIN_DISTRO }}
            type=ref,event=tag,suffix=-${{ matrix.distro }}
            type=ref,event=tag,enable=${{ matrix.distro == env.MAIN_DISTRO }}
            type=raw,value=${{ matrix.distro }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && matrix.distro == env.MAIN_DISTRO }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 各 arch イメージを 1 つの multi-arch manifest にまとめ、全タグに付ける。
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}
          DISTRO: ${{ matrix.distro }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            IMAGETOOLS_ARGS+=(-t "$tag")
          done
          docker buildx imagetools create "${IMAGETOOLS_ARGS[@]}" \
            "$IMAGE:$GITHUB_SHA-$DISTRO-amd64" \
            "$IMAGE:$GITHUB_SHA-$DISTRO-arm64"
